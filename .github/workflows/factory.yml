# The factory's CI jobs for GitHub Actions. Configure writes this file to
# .github/workflows/factory.yml (the merger looks for the factory's checks in exactly that
# file) and fills claude-opus-5.5 / gpt-5.6-sol with review.models from factory.yml and
# claude-opus-5-5 / gpt-5-6-sol with their job slugs (lowercase, non-alphanumerics -> "-").
#
# `pull_request`, never `pull_request_target`: the jobs get a read-only token and no secrets on
# forks. Nothing that judges the pull request comes from the pull request itself, so it cannot
# change its own gates: the factory/ scripts and prompt are read from the DEFAULT branch, also for
# a pull request into a feature branch, which the crew pushes to; the rules are the default
# branch's factory.yml, made stricter by the target branch's (DESIGN.md, "Feature-branch rules
# can only tighten"). Only the pull request that adds the factory uses its own copy (bootstrap),
# and only when the repository's owner or a member of its organization opened it: the review
# jobs hold KIRO_API_KEY, and that copy is code the author wrote. From anyone else the jobs fail.
# One exception:
# factory-docs checks the docs against the pull request's own factory.yml (`areas`,
# `docs_allow`), because they describe the docs it changes. .github/workflows/**,
# factory.yml and factory/** are gate paths: a person approves a change to them.
#
# With scope.mode own in factory.yml, factory-tier reports in_scope=0 for a pull request outside
# the factory's stream, and factory-docs and the reviews are skipped (`if:`), so the team's
# other pull requests cost no review credits and get no new red check. GitLab gets the same
# with exit 3 (templates/ci.gitlab.yml).
#
# Secret: KIRO_API_KEY as an ENVIRONMENT secret of the environment `factory`, not a repository
# secret: only the jobs below that declare that environment get it, and the repository's own
# workflows, which run the pull request's code, never do. Limit the environment's deployment
# branches if pull requests from branches must not reach it. Pin the actions below to commit
# SHAs in your repository.
#
# Runner image: every job names its image (`ubuntu-24.04`), never `ubuntu-latest`. GitHub moves
# `ubuntu-latest` to a new Ubuntu release on its own schedule, and a new release can change what
# the review depends on (its sudo, its Python, the tools on the image) on a day nobody chose.
# To move: change `runs-on` in ALL jobs in one pull request (a gate path, so a person approves
# it) and read the two ai-review jobs' logs on that pull request: "confine: check passed" must
# be there and no line from sudo. The review itself does not rely on what sudo keeps of the
# environment (factory/review/review.sh passes each step's variables explicitly).
#
# Each review shows on the pull request: review-comment-<model> posts one comment per review
# model and edits it on later runs (factory/review/publish.py), and writes the whole review to
# its job summary. Those two jobs are the only ones that may write (`pull-requests: write`), so
# they hold no KIRO_API_KEY (no `environment`) and run nothing of the pull request: their only
# checkout is the default branch's factory/, and the review reaches them as an artifact they
# read as data. Before the default branch has publish.py they post nothing. They decide
# nothing: the merger does not count a failed or cancelled review-comment job of a configured
# review model (an edit of the title cancels a running one), and waits while one is running.
# A pull request from a fork gets no comment: its token cannot write. As for every job here, a pull request from a branch of this repository runs the
# workflow file it carries: it can give itself `pull-requests: write` and comment as
# github-actions[bot], this comment included. The comment informs; the checks decide.
name: factory

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: factory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Who opened the pull request, as GitHub reports it: OWNER, MEMBER, COLLABORATOR, CONTRIBUTOR, ...
  FACTORY_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
  FACTORY_FROM_TARGET: |
    set -euo pipefail
    # By full refspec: asked for `main`, git fetches a TAG `main` when there is one and leaves
    # the branch as the checkout had it, or absent, which would look like "no factory yet".
    git fetch --quiet origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" \
      "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
    FACTORY_DIR="$(mktemp -d)"
    # The full ref names: a tag or a branch named `origin/<branch>` must not stand in.
    D="refs/remotes/origin/${{ github.event.repository.default_branch }}"
    T="refs/remotes/origin/$GITHUB_BASE_REF"
    # The scripts always from the default branch: a feature branch is pushed by the crew.
    if git cat-file -e "$D:factory/fcore.py" 2>/dev/null && git cat-file -e "$D:factory.yml" 2>/dev/null; then
      git archive "$D" factory | tar -x -C "$FACTORY_DIR"
      git show "$T:factory.yml" > "$FACTORY_DIR/factory.yml" 2>/dev/null \
        || git show "$D:factory.yml" > "$FACTORY_DIR/factory.yml"
      echo "factory: scripts from $D, rules from $D made stricter by $T"
    else
      # The pull request's own factory/ is about to run, in jobs that hold KIRO_API_KEY.
      case "${FACTORY_AUTHOR_ASSOCIATION:-}" in
        OWNER|MEMBER) ;;
        *) echo "::error::factory: $D has no factory yet, and this pull request's own copy runs" \
             "only when the repository's owner or a member of its organization opened it" \
             "(author_association: '${FACTORY_AUTHOR_ASSOCIATION:-}'). Ask one of them to open" \
             "the pull request that adds the factory."
           exit 1 ;;
      esac
      echo "factory: not on $D yet, using this pull request's copy (bootstrap)"
      cp -r factory factory.yml "$FACTORY_DIR/"
    fi
    git show "$D:factory.yml" > "$FACTORY_DIR/default-factory.yml" 2>/dev/null \
      || cp "$FACTORY_DIR/factory.yml" "$FACTORY_DIR/default-factory.yml"
    echo "FACTORY_DIR=$FACTORY_DIR" >> "$GITHUB_ENV"

jobs:
  factory-tier:
    name: factory-tier
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      in_scope: ${{ steps.tier.outputs.in_scope }}
      tier: ${{ steps.tier.outputs.tier }}
      checks: ${{ steps.tier.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true   # git fetch of the target branch below
      - run: eval "$FACTORY_FROM_TARGET"
      - run: pip install --quiet --disable-pip-version-check pyyaml
      - id: tier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$FACTORY_DIR/factory/tier.py" "$FACTORY_DIR/factory.yml" "$FACTORY_DIR/default-factory.yml"

  factory-docs:
    name: factory-docs
    needs: factory-tier
    # scope.mode own: a pull request outside the factory's stream skips (GitLab: exit 3).
    if: needs.factory-tier.outputs.in_scope != '0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: eval "$FACTORY_FROM_TARGET"
      - run: pip install --quiet --disable-pip-version-check pyyaml
      - run: python3 "$FACTORY_DIR/factory/docs_gate.py" --root . --config factory.yml --baseline "$FACTORY_DIR/factory/docs-baseline.txt"

  ai-review-a:
    name: ai-review-claude-opus-5-5
    needs: factory-tier
    # A review the tier does not need is skipped, and so is every review of a pull request
    # outside the factory's scope (scope.mode own: factory-tier lists no checks); the merger
    # accepts the skip only where factory.yml allows it.
    if: contains(needs.factory-tier.outputs.checks, ',ai-review-claude-opus-5-5,')
    runs-on: ubuntu-24.04
    environment: factory    # KIRO_API_KEY is an environment secret of `factory` (see the header)
    permissions:
      contents: read
      issues: read          # the issues the pull request closes, for the review's context
      pull-requests: read
      checks: read          # earlier blocked review rounds, for the push budget
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: eval "$FACTORY_FROM_TARGET"
      - run: pip install --quiet --disable-pip-version-check pyyaml
      - env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          FACTORY_TIER: ${{ needs.factory-tier.outputs.tier }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$FACTORY_DIR/factory/review/review.sh" "claude-opus-5.5"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-claude-opus-5-5
          path: |
            .review/
            kiro-usage/
          include-hidden-files: true   # .review/ is a hidden folder: left out without a word otherwise
          retention-days: 7

  ai-review-b:
    name: ai-review-gpt-5-6-sol
    needs: factory-tier
    if: contains(needs.factory-tier.outputs.checks, ',ai-review-gpt-5-6-sol,')
    runs-on: ubuntu-24.04
    environment: factory    # KIRO_API_KEY is an environment secret of `factory` (see the header)
    permissions:
      contents: read
      issues: read          # the issues the pull request closes, for the review's context
      pull-requests: read
      checks: read          # earlier blocked review rounds, for the push budget
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: eval "$FACTORY_FROM_TARGET"
      - run: pip install --quiet --disable-pip-version-check pyyaml
      - env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          FACTORY_TIER: ${{ needs.factory-tier.outputs.tier }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$FACTORY_DIR/factory/review/review.sh" "gpt-5.6-sol"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-gpt-5-6-sol
          path: |
            .review/
            kiro-usage/
          include-hidden-files: true   # .review/ is a hidden folder: left out without a word otherwise
          retention-days: 7

  review-comment-a:
    name: review-comment-claude-opus-5-5
    needs: ai-review-a
    # After the review whatever its verdict; not when the review itself was skipped.
    if: ${{ !cancelled() && needs.ai-review-a.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read          # publish.py, from the default branch
      pull-requests: write    # the comment
    timeout-minutes: 5
    steps:
      # No step fails the job: a comment that could not be posted is no red check for a person
      # to chase. The merger does not count this job either way.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}   # the branch by its full name; never the pull request's code
          sparse-checkout: factory
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true   # a review that failed before it wrote anything has no artifact
        with:
          name: review-claude-opus-5-5
          path: ${{ runner.temp }}/review   # outside the checkout: the artifact is data
      - continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_PR_NUMBER: ${{ github.event.pull_request.number }}
          FACTORY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FACTORY_REVIEW_RESULT: ${{ needs.ai-review-a.result }}   # PASS only when GitHub says so
        run: |
          if [ ! -f factory/review/publish.py ]; then
            echo "::notice::factory: the default branch has no factory/review/publish.py yet: no comment"
            exit 0
          fi
          python3 -I factory/review/publish.py --model "claude-opus-5.5" --dir "$RUNNER_TEMP/review" --summary "$GITHUB_STEP_SUMMARY"

  review-comment-b:
    name: review-comment-gpt-5-6-sol
    needs: ai-review-b
    if: ${{ !cancelled() && needs.ai-review-b.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read          # publish.py, from the default branch
      pull-requests: write    # the comment
    timeout-minutes: 5
    steps:
      # No step fails the job: a comment that could not be posted is no red check for a person
      # to chase. The merger does not count this job either way.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}   # the branch by its full name; never the pull request's code
          sparse-checkout: factory
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true   # a review that failed before it wrote anything has no artifact
        with:
          name: review-gpt-5-6-sol
          path: ${{ runner.temp }}/review   # outside the checkout: the artifact is data
      - continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_PR_NUMBER: ${{ github.event.pull_request.number }}
          FACTORY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FACTORY_REVIEW_RESULT: ${{ needs.ai-review-b.result }}   # PASS only when GitHub says so
        run: |
          if [ ! -f factory/review/publish.py ]; then
            echo "::notice::factory: the default branch has no factory/review/publish.py yet: no comment"
            exit 0
          fi
          python3 -I factory/review/publish.py --model "gpt-5.6-sol" --dir "$RUNNER_TEMP/review" --summary "$GITHUB_STEP_SUMMARY"
